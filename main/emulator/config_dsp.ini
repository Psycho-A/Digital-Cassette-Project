##############
# ANALOG RX/TX
##############

[analog.rx]
fadein_ms = 0
enable_dsp = 1
tape_correction = 1
downmix_to_mono = 0

[analog.tx]
fadein_ms = 0
enable_dsp = 0
tape_correction = 1
downmix_to_mono = 0


####################
# AAC-DECODER RX DSP
####################

[dsp_dechirp.ad]
enabled = 1
lower_freq_hz = 7000
reduction_level_db = -3.0
chirp_threshold_db = -32.0
enhance_peaks_db = 3.0
peaks_floor_db = -24.0
attack_ms = 2
release_ms = 50
knee_width_db = 6.0

[dsp_width.ad]
enabled = 1
width_percent = 115
lpf_enable = 1
lpf_cutoff_hz = 12000

[dsp_eq.ad]
enabled = 1
preamp_db  = 0.0
low_shelf  = 40, 3.0
band_peak  = 2000, 0.0, 1.00
high_shelf = 13500, 6.0

[dsp_agc.ad]
enabled = 1
initial_gain_db = -6.0
target_rms_db = -16.0
max_gain_db = 6.0
gain_attack_ms = 1000.0
gain_release_ms = 3000.0
reset_after_s = 3.0

[dsp_limiter.ad]
enabled = 0
threshold_db = -0.5
hold_ms = 20
release_ms = 50


##################
# ANALOG RX/TX DSP
##################

[dsp_denoise.rx]
enabled = 1
lower_freq_hz = 8000				# 8000: good for most cases
reduction_level_db = -12.0			# -12: soft | -20: agressive
noise_threshold_db = -48.0			# -48: default (+tape_correction value)
attack_ms = 3						# 2-3: fast attacks, 5-10: smoother
release_ms = 50						# 50: good for most cases
knee_width_db = 3.0					# sharp: 3.0 | soft: 6.0
enhance_peaks_db = 3.0				# 3: default (+tape_correction value)
peaks_floor_db = -20.0				# -20: default (+tape_correction value)
rms_window_cycles = 4				# 4: fast seeking | 10-100: smooth
filter_q = 0.7071					# 0.7071: standard flat-slope Q
filter_order = 4					# 4: best falloff sharpness
rumble_cutoff_hz = 40				# 40: cuts sub-sonic frquences
rumble_filter_order = 0				# 0: disable filter | 2-4: normal
linked_stereo = 0					# use single gains for both channels
compander_mode = 0					# invert reduction and enhance levels

[dsp_denoise.tx]
enabled = 0
lower_freq_hz = 8000
reduction_level_db = -12.0
noise_threshold_db = -40.0
attack_ms = 5
release_ms = 50
knee_width_db = 6.0
enhance_peaks_db = 3.0
peaks_floor_db = -20.0
rms_window_cycles = 4
filter_q = 0.7071
filter_order = 4
linked_stereo = 0
compander_mode = 1

[dsp_width.rx]
enabled = 1
width_percent = 110					# 110: tape compensation | comfort enhancing
hpf_enable = 1						# 1: enable (recommended for noisy tapes)
hpf_cutoff_hz = 200					# 200: squeeze low energy
lpf_enable = 0
lpf_cutoff_hz = 12500

[dsp_eq.rx]
enabled = 1
preamp_db  = 0.0
low_shelf  = 63, 6.0, 0.7071, 2 	# soft: 40, 6.0, 0.7071 | tape-bias: 40, 9.0, 0.7071
band_peak  = 500, -1.5, 0.7071, 2 	# special needs only | cheap-tape: 500, -3.0, 0.7071
high_shelf = 12500, 6.0, 0.7071, 2 	# soft: 12500, 6.0, 0.7071 | tape-bias: 9000, 12.0, 0.50

[dsp_eq.tx]
enabled = 0
preamp_db  = -3.0
low_shelf  = 63, 6.0, 0.7071, 2
band_peak  = 500, 0.0, 0.7071, 2
high_shelf = 12500, 6.0, 0.7071, 2

[dsp_agc.rx]
enabled = 1
initial_gain_db = -6.0				# -6: prevents sudden volume spikes
target_rms_db = -16.0				# -16: optimal for most music (brickwall reduce)
max_gain_db = 6.0					# 6: best max gain if too quiet (noise-protect)
gain_attack_ms = 1000.0				# 1000 ms: very smooth adaptation
gain_release_ms = 3000.0			# 3000 ms: very smooth restoration
rms_window_ms = 500.0				# 500: best for slow adaptation
silence_threshold_db = -40.0		# -40: good for most cases
reset_after_s = 3.0					# 3 sec: typical time-gap between tracks

[dsp_agc.tx]
enabled = 0
initial_gain_db = -6.0
target_rms_db = -16.0
max_gain_db = 6.0
gain_attack_ms = 1000.0
gain_release_ms = 3000.0
rms_window_ms = 500.0
silence_threshold_db = -40.0
reset_after_s = 3.0

[dsp_limiter.rx]
enabled = 1
threshold_db = -0.5					# -1.0: prevents only maximum clips
hold_ms = 10						# 10: good time before apply attack
release_ms = 50						# 50: default value, usually unchanged
knee_width_db = 0.0					# 0: disable knee | 3+ to compress peaks
preamp_db = 0.0						# 0: disabled | usually untouched
linked_stereo = 0					# 0: disabled | 1: simultaneous gain

[dsp_limiter.tx]
enabled = 0
threshold_db = -1.0
hold_ms = 20
release_ms = 50
knee_width_db = 0.0
preamp_db = 0.0
linked_stereo = 1
