[input]
pcm_rate = 44100
pcm_channels = 2
pcm_bits = 16
audio_backend = wav

[output]
pcm_rate = 44100
pcm_channels = 2
pcm_bits = 16
force_rate = 0
audio_backend = wav

[ofdm]
qam_order = 4					# modulation order or num ASK bit-levels
symbols_per_frame = 8			# unused for now (OFDM-only)
low_freq_hz = 1000				# unused for now (OFDM-only)
high_freq_hz = 11000			# unused for now (OFDM-only)
fft_size = 1024					# unused for now (OFDM-only)
prefer_ask = 1					# use ASK logic for frame calculations/encoding

[m-ask]
preamble_symbols = 4			# low-frequency preamble anchor symbols (min/default = 4)
training_symbols = 16			# thresholds and ISI calculations, default: 16 (min = 16)
pilot_interval = 40				# AGC and frame-integrity anchors, default: 32 (min = 16)


######################
# MODULATION/RECORDING
######################

[tx_modulate]
encode_audio = 1				# enable FDK-AAC encoder for all PCM-detected streams
stereo_mode = 1					# use two audio-channels with parallel independet frames
variable_length = -1			# cut frame pair by payload size instead of max-cap (-1: for audio)
use_lead_symbols = 1			# write 16 zero-symbols at frame start/end (helps instant capture)
pre-emphasis_eq = 1				# enable DSP pre-process for TX record (see above, avoid pre-bias!)

[tx_modulate_ask]
frame_bytes = -1				# override OFDM payload calculation (-1 = auto by pcm_rate or freq)
carrier_freq = 9000   			# forced freq (changes out pcm_rate/samples_per_cycle, -1 = auto)
low_level_db = -12.0			# best -12 for 2-ASK, -15 for 4-ASK (also used by RX DRC-meter)
high_level_db = -3.0			# best -6 for all-order ASK is optimum level (for RX DRC-meter too)
samples_per_cycle = 4			# only to set carrier_freq/pcm_rate in TX (RX mode reads any ones)

[tx_audiocoder]
codec_format = -1				# default HE-AAC v2 (or v1 on mono-source)
bitrate_kbps = -1				# only change on debug (-1 = best calculated on session)
audio_channels = 2				# stereo by default (or mono on 1-ch source)
use_hard_cbr = 0				# limit peak bitrate with defined max (constant frame sizes)
high_quality = 1				# afterburner mode (less "metallic" artifacts, slower)

[tx_preemph_eq]
record_level = 0.0
rumble_preamp_db = 9.0			# preamp signal below 400 Hz (default: 9.0 dB)
treble_preamp_db = 12.0			# preamp signal above 19 kHz (default: 12.0 dB)
bias_correction = 0				# bias curve presets (0=off, 3=CrFe), unwanted!


#######################
# DEMODULATION/PLAYBACK
#######################

[rx_demod]
decode_audio = 0				# enable FAAD2 process on AUDIO_ADTS frames
core_policy = 0					# pass, null, replicate, skip frame (main half)
crc_lsb_policy = 0				# pass, null, replicate, skip frame (second half)
fill_missing = 0				# for DATA frames (0+) in file backend only 
enable_agc = 1					# required for all modes (disable only for debug)
reset_state_frames = 20			# how many undetected frames pass before full reset
invert_phase = 0				# -1 = auto-detect by period peaks (per-channel)
enhance_aac = 1					# use DSP effects to smooth compression artifacts
preprocess_eq = 1				# enables all processing in the section below

[rx_demod_ask]
agc_percent = -1 				# default: 100 (debug only - don't change without extra needs!)
agc_smoothing = -1				# for pilots and drift, 0-99 (-1 = auto, 45-50 is default)
level_bad_zone = 2				# threshold's unstable zone in percent (for heuristic corrections)
correct_dynamics = 100			# percent of data's DR compression relative to preamble (0 = off)
correct_mid_levels = 0			# for 4-ASK, corrects levels 2 & 3 ratios inside of amps range
measure_dynamics = 1			# measure record's max/min ratio (dynamic range) to calibrate level
temp_workarounds = 1			# a set of dirty hacks for enhancement on various signal params

[rx_demod_eq]
level_preamp = 0.0
adaptive_bias = 1				# lf-sync/amp_max
adaptive_dering = 2				# one->first/steady
rumble_filter_db = -18.0 		# default: -9.0/-12.0
bias_tape_profile = 1			# bad-tapes only [0=off]
bias_deadzone = -1  			# default: 0.35-0.50
dering_filter_q = 0.33			# default: 0.33/0.30
dering_sideband_pos = 0.33		# default: 0.33/0.50
dering_filter_khz = 15			# default: 15 (10-19)
dering_deadzone = -1			# default: 0.02-0.10
gain_max_step_db = 9.0			# default: 3.00-9.00
auto_gain_smooth = 0.10			# default: 0.10/0.50
accurate_preamp = 1				# biquad-accurate calculation
dump_raw_samples = 0			# raw_samples.pcm


###################
# SERVICE/INTERFACE
###################

[service]
max_freq_hz = 5000
repeat_count = 5
toc_user_file = toc_none.lst
toc_kv_template = NAME=%s\nSIZE=%u\nTIME=%u\nCRC=%04X\n
eof_kv_template = EOF=1\nSTREAM=%i\nSIZE=%u\nCRC=%04X\n

[metadata]
insert_gaps = 1
insert_frames = 50
max_frames = 1
#meta_user_file = xtest_file_bFF.dat
#kv_tag_template = RecordTime=%010u\nTimeStamp=%010u\nDuration=%010u\nArtist=%s\nTitle=%s\nAlbum=%s\nGenre=%s\nYear=%u\n
kv_tag_number = 01
kv_tag_tracks = 05
kv_tag_duration = 1800
kv_tag_year = 2026
kv_tag_artist = Psycho-A
kv_tag_title = I'm Working On
kv_tag_album = Digital Cassette
kv_tag_genre = Test Record
kv_tag_comment = Some comment

[metadata_ui]
enable_window = 1
window_font_file = resources\FleftexMono.ttf
window_font_name = Fleftex
window_font_size = 14
window_font_bold = 0


####################
# PCM AUDIO BACKENDS
####################

[stream]
timeout_ms = 500				# time to wait for next samples in stream mode
chunk_samples = -1				# equal to ADTS frame chunks (DON'T change if using AAC)
payload_class = 10				# for stdin or WinMM input (10 = payload_audio/ADTS)
fadeout_ms = 500				# for switching RX/TX/analog modes (unimplemented)
debug_logging = 1				# enable debug-info output to cassette.exe.log file

[pcm_winmm]
source_device = -1 				# device index or it's name part (0/-1 = default)
sink_device = -1 				# device index or it's name part (0/-1 = default)
source_buffering = 4			# ring-buffer size multiplier, helps frame drops (2-8)
sink_buffering = 4				# ring-buffer and start-delay, helps initial tearing (0-8)
buffer_count = 4				# number of I/O buffers: smoother -> more delay (2-8)
buffer_multiplier = 1			# may help with ABR stream tearing, but time-laggy (1-4)
list_devices = 1				# list avaliable input/output devices on program start
